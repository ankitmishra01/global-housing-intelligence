name: Bug report
description: Something on the site or in the pipeline is wrong or broken
labels: [bug]
body:
  - type: input
    id: page
    attributes:
      label: Page or script
      description: URL on the live site, or the script you ran (for example sync/seed.js)
      placeholder: https://global-housing-intelligence.vercel.app/countries/CAN
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Move the rate toggle to ...
        3. See ...
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots, logs or numbers
      description: Paste error output or the numbers that look wrong (with their source if you know it)
  - type: dropdown
    id: kind
    attributes:
      label: Kind of problem
      options:
        - A number looks wrong
        - Page error or broken layout
        - Pipeline or workflow failure
        - Something else
    validations:
      required: true
